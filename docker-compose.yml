# Postgres local para testes. Uso: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: csm
      POSTGRES_PASSWORD: csm_dev_pass
      POSTGRES_DB: csm_gestao
    ports:
      - "5432:5432"
    volumes:
      - csm_pgdata:/var/lib/postgresql/data
volumes:
  csm_pgdata:
